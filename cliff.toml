# git-cliff configuration - drives both the version bump and the release notes.
# Preview the next version and notes locally with: make changelog

[changelog]
header = ""
body = """
{% macro remote_url() %}https://github.com/sammcj/mermaid-check{% endmacro %}
{% if version -%}
### [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
### Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
#### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
# Regex (not a glob), matched against tag names. Anchored at the start so a
# tag like "release-v1" is not mistaken for a release; left open at the end so
# pre-release suffixes such as v1.2.3-rc1 still match.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"

# Dependency bumps are their own release type so they can drive a minor bump
# (parity with the previous custom_release_rules).
commit_preprocessors = [
  { pattern = '^chore\(deps\)', replace = "deps" },
  { pattern = '^chore\(deps-dev\)', replace = "deps" },
]

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^deps", group = "<!-- 3 -->Dependency Updates" },
  { message = "^refactor", group = "<!-- 4 -->Refactor" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^revert", group = "<!-- 6 -->Reverts" },
  # Kept rather than skipped so a housekeeping-only push still produces a patch
  # bump, matching the previous default_bump setting.
  { message = "^(build|ci|chore|style|test)", group = "<!-- 7 -->Miscellaneous" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
custom_minor_increment_regex = "^deps$"
